<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d9dee3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Smart Parking">
<title>Smart Parking 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --scene: #d9dee3;
    --panel: rgba(255,255,255,.9);
    --solid: #ffffff;
    --ink: #1c2530;
    --muted: #5d6874;
    --line: rgba(28,37,48,.13);
    --free: #1f9d55;
    --occ: #e03e3e;
    --res: #e8a317;
    --off: #8d97a1;
    --focus: #2b6cb0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --scene: #1b222c; --panel: rgba(30,38,50,.92); --solid: #242e3c;
      --ink: #e9eef4; --muted: #9ba7b5; --line: rgba(233,238,244,.15); --focus: #6aa7ea;
    }
  }
  :root[data-theme="dark"] {
    --scene: #1b222c; --panel: rgba(30,38,50,.92); --solid: #242e3c;
    --ink: #e9eef4; --muted: #9ba7b5; --line: rgba(233,238,244,.15); --focus: #6aa7ea;
  }
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  *, *::before, *::after { box-sizing: inherit; margin: 0; padding: 0; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    height: 100%; overflow: hidden; background: var(--scene); color: var(--ink);
    font-family: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .glass { background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }

  /* ---------- Yuqori panel ---------- */
  .top {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5;
    padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 0;
    display: grid; gap: 8px; pointer-events: none;
  }
  .top > * { pointer-events: auto; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; border-radius: 14px; padding: 8px 10px 8px 12px; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand h1 { font-size: 16px; font-weight: 700; line-height: 1.2; }
  .brand p { font-size: 12px; color: var(--muted); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46vw; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--off); flex: none; }
  .dot.live { background: var(--free); animation: pulse 1.6s infinite; }
  .dot.sim { background: var(--focus); }
  .dot.demo { background: var(--res); }
  .dot.lost { background: var(--occ); }
  @keyframes pulse { 50% { opacity: .35; } }
  .link { font-size: 13px; font-weight: 500; color: var(--ink); text-decoration: none; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); flex: none; background: transparent; font-family: inherit; cursor: pointer; }
  .barBtns { display: flex; gap: 6px; flex: none; }
  #nightBtn[aria-pressed="true"] { background: var(--ink); color: var(--scene); border-color: var(--ink); }

  .seg { display: grid; border-radius: 12px; padding: 3px; }
  .seg.modes { grid-template-columns: repeat(3, 1fr); }
  .seg.floors { grid-template-columns: repeat(4, 1fr); }
  .seg button {
    border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 13px; font-weight: 500;
    min-height: 36px; border-radius: 9px; cursor: pointer; position: relative;
  }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--scene); }
  .seg button.offline::after { content: ""; position: absolute; top: 6px; right: 8px; width: 6px; height: 6px; border-radius: 50%; background: var(--occ); }

  .hint {
    position: fixed; left: 12px; right: 12px; z-index: 4; text-align: center;
    top: calc(150px + env(safe-area-inset-top, 0px));
    font-size: 12px; color: var(--muted); pointer-events: none;
  }

  /* ---------- Pastki ekran (konsol) ---------- */
  .console {
    position: fixed; left: 12px; right: 12px; z-index: 6;
    bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    border-radius: 16px; overflow: hidden; transition: opacity .2s;
    max-width: 720px; margin: 0 auto;
  }
  body.sheet-open .console { opacity: 0; pointer-events: none; }
  .cHead {
    width: 100%; border: 0; background: transparent; color: var(--ink); font: inherit; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px; min-height: 48px;
  }
  .counts { display: flex; gap: 14px; font-size: 13px; align-items: center; }
  .counts span { display: inline-flex; align-items: center; gap: 6px; }
  .counts i { width: 10px; height: 10px; border-radius: 3px; }
  .counts b { font-size: 16px; }
  .chev { font-size: 12px; color: var(--muted); }
  .cBody { display: none; border-top: 1px solid var(--line); padding: 10px 14px 12px; }
  .console.open .cBody { display: block; }
  .scen { display: none; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; margin-bottom: 10px; }
  body.mode-sim .scen { display: grid; }
  .scen button { font: inherit; font-size: 12px; font-weight: 500; min-height: 38px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
  .log { list-style: none; max-height: 28vh; overflow-y: auto; font-size: 13px; }
  .log li { display: flex; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--line); color: var(--muted); line-height: 1.35; }
  .log li:last-child { border-bottom: 0; }
  .log time { color: var(--ink); font-variant-numeric: tabular-nums; flex: none; }

  /* ---------- Joy oynasi ---------- */
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    transform: translateY(105%); transition: transform .26s ease;
    background: var(--solid); border-top: 1px solid var(--line);
    border-radius: 20px 20px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,.18);
    padding: 10px 16px calc(16px + env(safe-area-inset-bottom, 0px));
    max-width: 480px; margin: 0 auto;
  }
  .sheet.open { transform: translateY(0); }
  .grip { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 10px; }
  .sheet header { display: flex; justify-content: space-between; align-items: center; }
  .sheet h2 { font-size: 18px; font-weight: 700; }
  .x { border: 0; background: transparent; color: var(--muted); font-size: 24px; width: 40px; height: 40px; border-radius: 10px; cursor: pointer; }
  .state { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 4px 0 14px; }
  .state span { font-size: 14px; font-weight: 500; }
  .timer { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--res); }
  .timer.low { color: var(--occ); animation: pulse 1s infinite; }
  .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .actions button, .chips button {
    font: inherit; font-size: 14px; font-weight: 500; min-height: 48px; border-radius: 12px; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: var(--ink);
  }
  .actions button.primary { background: var(--ink); color: var(--scene); border-color: var(--ink); }
  .actions button:disabled { opacity: .3; cursor: default; }
  .chips { display: none; margin-top: 10px; }
  .chips.show { display: block; }
  .chips p { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .chips div { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
  .chips button { font-weight: 700; }
  .carBtn { display: none; width: 100%; margin-top: 10px; font: inherit; font-size: 14px; font-weight: 500; min-height: 44px; border-radius: 12px; border: 1px dashed var(--line); background: transparent; color: var(--muted); cursor: pointer; }
  body.mode-sim .carBtn, body.mode-demo .carBtn { display: block; }
  .note { font-size: 12px; color: var(--muted); margin-top: 10px; min-height: 16px; }
  button:focus-visible, .link:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .toast {
    position: fixed; left: 50%; top: calc(150px + env(safe-area-inset-top, 0px)); z-index: 20;
    transform: translateX(-50%); background: var(--ink); color: var(--scene);
    font-size: 14px; padding: 10px 14px; border-radius: 12px; max-width: calc(100% - 32px); text-align: center;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .toast.show { opacity: 1; }

  @media (min-width: 720px) {
    .top { grid-template-columns: 1fr auto auto; align-items: center; padding-left: 16px; padding-right: 16px; }
    .seg.modes, .seg.floors { grid-auto-flow: column; grid-template-columns: none; }
    .seg button { padding: 0 14px; }
    .sheet { bottom: 16px; border-radius: 20px; border: 1px solid var(--line); }
    .hint { top: auto; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
  }
  @media (prefers-reduced-motion: reduce) { .sheet, .console, .toast { transition: none; } .dot.live, .timer.low { animation: none; } }
</style>
</head>
<body class="mode-real">

<canvas id="scene" aria-label="Smart Parking maketining 3D ko'rinishi"></canvas>

<div class="top">
  <div class="bar glass">
    <div class="brand">
      <span class="dot" id="dot"></span>
      <div>
        <h1>Smart Parking</h1>
        <p id="liveText">Serverga ulanmoqda</p>
      </div>
    </div>
    <div class="barBtns">
      <button class="link" id="nightBtn" aria-pressed="false">🌙 Tun</button>
      <a class="link" id="tableLink" href="/">Jadval</a>
    </div>
  </div>
  <div class="seg modes glass" role="group" aria-label="Rejim">
    <button data-mode="real" aria-pressed="true">Real</button>
    <button data-mode="sim" aria-pressed="false">Simulyatsiya</button>
    <button data-mode="demo" aria-pressed="false">Demo</button>
  </div>
  <div class="seg floors glass" role="group" aria-label="Qavatni tanlash">
    <button data-floor="0" aria-pressed="true">Hammasi</button>
    <button data-floor="1" aria-pressed="false">1-qavat</button>
    <button data-floor="2" aria-pressed="false">2-qavat</button>
    <button data-floor="3" aria-pressed="false">3-qavat</button>
  </div>
</div>

<p class="hint" id="hint"></p>

<div class="console glass" id="console">
  <button class="cHead" id="consoleToggle" aria-expanded="false">
    <span class="counts">
      <span><i style="background:var(--free)"></i><b id="cFree">–</b> bo'sh</span>
      <span><i style="background:var(--occ)"></i><b id="cOcc">–</b> band</span>
      <span><i style="background:var(--res)"></i><b id="cRes">–</b> rezerv</span>
    </span>
    <span class="chev" id="chev">Hodisalar ▲</span>
  </button>
  <div class="cBody">
    <div class="scen">
      <button data-scen="empty">Bo'shatish</button>
      <button data-scen="full">To'ldirish</button>
      <button data-scen="random">Tasodifiy</button>
      <button data-scen="last">Bitta joy qoldi</button>
    </div>
    <ul class="log" id="log"></ul>
  </div>
</div>

<div class="sheet" id="sheet" role="dialog" aria-labelledby="sheetTitle">
  <div class="grip"></div>
  <header>
    <h2 id="sheetTitle">1-qavat, 1-joy</h2>
    <button class="x" id="sheetClose" aria-label="Yopish">×</button>
  </header>
  <div class="state">
    <span id="sheetState">Bo'sh</span>
    <b class="timer" id="sheetTimer"></b>
  </div>
  <div class="actions">
    <button class="primary" id="btnReserve">Band qilish</button>
    <button id="btnExtend">Vaqt qo'shish</button>
    <button id="btnArrive">Keldim</button>
  </div>
  <div class="chips" id="chips">
    <p id="chipsTitle"></p>
    <div id="chipsRow"></div>
  </div>
  <button class="carBtn" id="btnCar">Mashina qo'yish</button>
  <div class="note" id="sheetNote"></div>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  // =====================================================================
  //  O'LCHAMLAR VA RANGLAR
  // =====================================================================
  const W = 60, D = 40;
  const FY = { 1: 0, 2: 13, 3: 26 };
  const SLAB = 1.2;
  const COLOR = { FREE: "#1f9d55", OCCUPIED: "#e03e3e", RESERVED: "#e8a317", NO_DATA: "#8d97a1" };
  const LABEL = {
    FREE: "Bo'sh, band qilish mumkin",
    OCCUPIED: "Joyda mashina turibdi",
    RESERVED: "Band qilingan",
    NO_DATA: "Qavat qurilmasi bilan aloqa yo'q",
  };
  const CAR_COLORS = [0x1f6fd1, 0xf2c230, 0xc8102e, 0xe9ecef, 0x2b2f36, 0x1c7c54, 0x8a9099];
  const isPhone = Math.min(window.innerWidth, window.innerHeight) < 600;

  // =====================================================================
  //  RENDERER, KAMERA, YORUG'LIK
  // =====================================================================
  const canvas = document.getElementById("scene");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  const sceneColor = getComputedStyle(document.documentElement).getPropertyValue("--scene").trim() || "#d9dee3";
  scene.background = new THREE.Color(sceneColor);

  (function buildEnvironment() {
    const env = new THREE.Scene();
    const sky = new THREE.SphereGeometry(100, 32, 16);
    const pos = sky.attributes.position, cols = [];
    const low = new THREE.Color(0x6f7882), high = new THREE.Color(0xffffff);
    for (let i = 0; i < pos.count; i++) {
      const t = (pos.getY(i) / 100 + 1) / 2;
      const c = low.clone().lerp(high, Math.pow(t, 0.8));
      cols.push(c.r, c.g, c.b);
    }
    sky.setAttribute("color", new THREE.Float32BufferAttribute(cols, 3));
    env.add(new THREE.Mesh(sky, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
    const soft = new THREE.MeshBasicMaterial({ color: 0xffffff });
    for (const [x, y, z, s] of [[0, 90, 0, 80], [80, 40, 40, 40], [-80, 30, -30, 30]]) {
      const p = new THREE.Mesh(new THREE.PlaneGeometry(s, s), soft);
      p.position.set(x, y, z); p.lookAt(0, 0, 0); env.add(p);
    }
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(env, 0.03).texture;
  })();

  const camera = new THREE.PerspectiveCamera(40, 1, 1, 1200);
  const controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.maxPolarAngle = Math.PI * 0.47;
  controls.minDistance = 35;
  controls.maxDistance = 320;
  controls.enablePan = false;
  controls.target.set(7, 12, 4);

  const hemi = new THREE.HemisphereLight(0xffffff, 0x8e959c, 0.45);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffffff, 1.1);
  sun.position.set(55, 120, 85);
  sun.castShadow = true;
  sun.shadow.mapSize.set(isPhone ? 1024 : 2048, isPhone ? 1024 : 2048);
  Object.assign(sun.shadow.camera, { left: -80, right: 80, top: 80, bottom: -80, near: 20, far: 320 });
  sun.shadow.bias = -0.0004;
  sun.shadow.normalBias = 0.3;
  scene.add(sun);

  // =====================================================================
  //  MATERIALLAR
  // =====================================================================
  function canvasTexture(w, h, draw) {
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    draw(c.getContext("2d"), w, h);
    const t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding;
    t.anisotropy = 4;
    return t;
  }

  const asphaltTex = canvasTexture(256, 256, (x, w, h) => {
    x.fillStyle = "#3d4147"; x.fillRect(0, 0, w, h);
    const img = x.getImageData(0, 0, w, h);
    for (let i = 0; i < img.data.length; i += 4) {
      const n = (Math.random() - 0.5) * 34;
      img.data[i] += n; img.data[i + 1] += n; img.data[i + 2] += n;
    }
    x.putImageData(img, 0, 0);
  });
  asphaltTex.wrapS = asphaltTex.wrapT = THREE.RepeatWrapping;
  asphaltTex.repeat.set(5, 3.5);

  const foam = new THREE.MeshStandardMaterial({ color: 0xf1eee6, roughness: 0.9 });
  const foamDS = foam.clone(); foamDS.side = THREE.DoubleSide;
  const asphalt = new THREE.MeshStandardMaterial({ map: asphaltTex, roughness: 0.95, metalness: 0 });
  const asphaltDS = asphalt.clone(); asphaltDS.side = THREE.DoubleSide;
  const wood = new THREE.MeshStandardMaterial({ color: 0xc28b55, roughness: 0.75 });
  const paint = new THREE.MeshBasicMaterial({ color: 0xf3f1e8 });
  const darkMetal = new THREE.MeshStandardMaterial({ color: 0x2a3038, roughness: 0.5, metalness: 0.4 });

  function mesh(geo, mat, x, y, z, parent) {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x, y, z);
    m.castShadow = true; m.receiveShadow = true;
    (parent || scene).add(m);
    return m;
  }
  const box = (w, h, d, mat, x, y, z, p) => mesh(new THREE.BoxGeometry(w, h, d), mat, x, y, z, p);

  // =====================================================================
  //  BINO
  // =====================================================================
  // Tungi rejim uchun ro'yxat
  const NIGHT = { skyMat: null, lampMat: null, lamps: [], indoor: [], grassMat: null, roadMat: null, on: false };

  // ---------- Atrof-muhit: maysa, yo'l, piyodalar yo'lkasi, daraxtlar ----------
  (function buildSite() {
    const G = -SLAB;   // Yer sathi

    // Osmon
    const skyGeo = new THREE.SphereGeometry(520, 32, 16);
    const skyPos = skyGeo.attributes.position, skyCols = [];
    const skyLow = new THREE.Color(0xdfe7ec), skyHigh = new THREE.Color(0x8fb6d8);
    for (let i = 0; i < skyPos.count; i++) {
      const t = Math.max(0, skyPos.getY(i) / 520);
      const c = skyLow.clone().lerp(skyHigh, Math.pow(t, 0.7));
      skyCols.push(c.r, c.g, c.b);
    }
    skyGeo.setAttribute("color", new THREE.Float32BufferAttribute(skyCols, 3));
    const skyMat = new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, toneMapped: false });
    const sky = new THREE.Mesh(skyGeo, skyMat);
    sky.position.y = -40;
    scene.add(sky);
    scene.fog = new THREE.Fog(0xcfdae2, 300, 760);
    NIGHT.skyMat = skyMat;

    // Maysa
    const grassTex = canvasTexture(256, 256, function (x, w, h) {
      x.fillStyle = "#5f8a4e"; x.fillRect(0, 0, w, h);
      for (let i = 0; i < 2600; i++) {
        x.fillStyle = Math.random() < 0.5 ? "rgba(255,255,255,.07)" : "rgba(0,0,0,.09)";
        x.fillRect(Math.random() * w, Math.random() * h, 3, 5);
      }
    });
    grassTex.wrapS = grassTex.wrapT = THREE.RepeatWrapping;
    grassTex.repeat.set(24, 24);
    const grass = new THREE.Mesh(new THREE.PlaneGeometry(700, 700),
      new THREE.MeshStandardMaterial({ map: grassTex, roughness: 1 }));
    grass.rotation.x = -Math.PI / 2;
    grass.position.y = G - 0.1;
    grass.receiveShadow = true;
    scene.add(grass);

    const roadMat = new THREE.MeshStandardMaterial({ color: 0x4a4e54, roughness: 0.96 });
    const walkMat = new THREE.MeshStandardMaterial({ color: 0xb9b5aa, roughness: 0.95 });
    const curbMat = new THREE.MeshStandardMaterial({ color: 0xd8d4c8, roughness: 0.9 });
    const lineMat = new THREE.MeshBasicMaterial({ color: 0xe8e4d6 });

    // Bino atrofidagi piyodalar yo'lkasi
    const walk = mesh(new THREE.BoxGeometry(W + 26, 0.35, D + 26), walkMat, 0, G - 0.05, 0);
    walk.castShadow = false;

    // Kirish maydoni va yo'l
    mesh(new THREE.BoxGeometry(70, 0.3, 60), roadMat, 8, G, D / 2 + 42);
    mesh(new THREE.BoxGeometry(26, 0.3, 200), roadMat, 8, G, D / 2 + 130);
    for (let i = 0; i < 14; i++) {
      const dash = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 8), lineMat);
      dash.rotation.x = -Math.PI / 2;
      dash.position.set(8, G + 0.2, D / 2 + 46 + i * 15);
      scene.add(dash);
    }
    // Yo'l chekkalari
    mesh(new THREE.BoxGeometry(1.2, 0.9, 200), curbMat, -6.5, G + 0.2, D / 2 + 130);
    mesh(new THREE.BoxGeometry(1.2, 0.9, 200), curbMat, 22.5, G + 0.2, D / 2 + 130);

    // Daraxt: bitta geometriya, ko'p nusxa
    const trunkGeo = new THREE.CylinderGeometry(0.7, 1.0, 9, 8);
    const leafGeo = new THREE.IcosahedronGeometry(1, 0);
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6b4a2f, roughness: 0.95 });
    const leafMats = [
      new THREE.MeshStandardMaterial({ color: 0x3f7a42, roughness: 0.9, flatShading: true }),
      new THREE.MeshStandardMaterial({ color: 0x4f8f4a, roughness: 0.9, flatShading: true }),
      new THREE.MeshStandardMaterial({ color: 0x35673a, roughness: 0.9, flatShading: true }),
    ];
    function tree(x, z, scale) {
      const g = new THREE.Group();
      g.position.set(x, G, z);
      g.scale.setScalar(scale);
      g.rotation.y = Math.random() * Math.PI;
      const tr = new THREE.Mesh(trunkGeo, trunkMat);
      tr.position.y = 4.5; tr.castShadow = true;

        let st = it.status;

        s.remaining = it.remaining || 0;
        s.canExtend = !!it.canExtend;
        s.extended = !!it.extended;
        s.value = (it.value === undefined) ? null : it.value;

        if (st === "FREE") free++;

      const hh = String(t.getHours()).padStart(2, "0") + ":" + String(t.getMinutes()).padStart(2, "0") + ":" + String(t.getSeconds()).padStart(2, "0");
      return "<li><time>" + hh + "</time>" + e.text + "</li>";
    }).join("");
  }

  function addLocalLog(text) {
    localLog.unshift({ time: new Date().toISOString(), text: text });
    if (localLog.length > 50) localLog.pop();
    renderLog(localLog);
  }

  const consoleEl = document.getElementById("console");
  document.getElementById("consoleToggle").addEventListener("click", function () {
    const open = consoleEl.classList.toggle("open");
    document.getElementById("consoleToggle").setAttribute("aria-expanded", String(open));
    document.getElementById("chev").textContent = open ? "Hodisalar ▼" : "Hodisalar ▲";
  });

  // =====================================================================
  //  MAHALLIY DVIGATEL (simulyatsiya va demo)
  // =====================================================================
  const local = {};
  for (const k of Object.keys(slots)) local[k] = { car: false, reserved: false, until: 0, extended: false };

  function localReset(fill) {
    for (const k of Object.keys(local)) {
      local[k] = { car: fill === "full", reserved: false, until: 0, extended: false };
      if (fill === "random") local[k].car = Math.random() < 0.45;
    }
  }

  function localSnapshot() {
    const now = Date.now();
    const data = { floors: {} };
    for (const f of [1, 2, 3]) {
      data.floors[f] = {
        online: true,
        slots: LAYOUT[f].map(function (l) {
          const d = local[f + "-" + l.n];
          if (d.reserved && now >= d.until) {
            d.reserved = false; d.extended = false;
            addLocalLog(f + "-qavat, " + l.n + "-joy: muddat tugadi, to'siq tushirildi");
          }
          const remaining = d.reserved ? Math.ceil((d.until - now) / 1000) : 0;
          const status = d.reserved ? "RESERVED" : (d.car ? "OCCUPIED" : "FREE");
          return {
            slot: l.n, status: status, remaining: remaining, extended: d.extended,
            canExtend: d.reserved && !d.extended && remaining <= 60,
            value: d.car ? Math.round(Math.random() * 6) : 1200 + Math.round(Math.random() * 400),
          };
        }),
      };
    }
    return data;
  }

  function localAct(action, f, n, minutes) {
    const d = local[f + "-" + n];
    if (!d) return;
    if (action === "reserve") {
      if (d.car || d.reserved) { toast("Bu joyni band qilib bo'lmaydi"); return; }
      d.reserved = true; d.until = Date.now() + minutes * 60000; d.extended = false;
      addLocalLog(f + "-qavat, " + n + "-joy " + minutes + " daqiqaga band qilindi, to'siq ko'tarildi");
    } else if (action === "extend") {
      if (!d.reserved || d.extended) return;
      d.until += minutes * 60000; d.extended = true;
      addLocalLog(f + "-qavat, " + n + "-joy: " + minutes + " daqiqa vaqt qo'shildi");
    } else if (action === "arrive") {
      if (!d.reserved) return;
      d.reserved = false; d.extended = false;
      addLocalLog(f + "-qavat, " + n + "-joy: haydovchi yetib keldi, to'siq tushirildi");
    }
    applyData(localSnapshot());
  }

  function localToggleCar(f, n) {
    const d = local[f + "-" + n];
    if (!d) return;
    if (d.reserved && !d.car) {
      d.reserved = false; d.extended = false;
      addLocalLog(f + "-qavat, " + n + "-joy: band qilingan joyga mashina qo'yildi");
      d.car = true;
    } else {
      d.car = !d.car;
      addLocalLog(f + "-qavat, " + n + "-joy: mashina " + (d.car ? "qo'yildi (sensor: BAND)" : "olindi (sensor: BO'SH)"));
    }
    applyData(localSnapshot());
  }

  // =====================================================================
  //  REJIMLAR
  // =====================================================================
  let mode = "real", everLive = false, failCount = 0, pollTimer = null, localTimer = null, demoTimer = null;

  const MODE_TEXT = {
    real: "Real rejim: maketga ulanmoqda",
    sim: "Simulyatsiya: mashinalarni siz qo'yasiz",
    demo: "Demo: mashinalar o'z-o'zidan keladi",
    lost: "Server bilan aloqa uzildi",
    live: "Real rejim: maket bilan jonli aloqa",
  };
  const HINT = {
    real: "Mashinani sensor aniqlaydi. Joyni bosib band qilishingiz mumkin.",
    sim: isPhone ? "Mashina qo'yish yoki olish: joyni uzoq bosing. Band qilish: bir marta bosing."
                 : "Mashina qo'yish yoki olish: joyni sichqonchaning o'ng tugmasi bilan bosing. Band qilish: chap tugma.",
    demo: "Mashinalar avtomatik kelib-ketadi. Joyni bosib band qilib ko'ring.",
  };

  function setStatusText(kind) {
    const dot = document.getElementById("dot"), txt = document.getElementById("liveText");
    dot.className = "dot " + (kind === "live" ? "live" : kind === "sim" ? "sim" : kind === "demo" ? "demo" : kind === "lost" ? "lost" : "");
    txt.textContent = MODE_TEXT[kind];
  }

  function stopTimers() {
    clearInterval(pollTimer); clearInterval(localTimer); clearInterval(demoTimer);
    pollTimer = localTimer = demoTimer = null;
  }

  function setMode(next) {
    mode = next;
    stopTimers();
    closeSheet();
    document.body.className = "mode-" + next;
    const btns = document.querySelectorAll(".seg.modes button");
    for (const b of btns) b.setAttribute("aria-pressed", String(b.dataset.mode === next));
    document.getElementById("hint").textContent = HINT[next];
    document.getElementById("tableLink").style.display = next === "real" ? "" : "none";

    if (next === "real") {
      everLive = false; failCount = 0;
      setStatusText("real");
      poll();
      pollTimer = setInterval(poll, 1000);
    } else {
      setStatusText(next);
      localReset(next === "demo" ? "random" : "empty");
      localLog = [];
      addLocalLog(next === "demo" ? "Demo rejim yoqildi" : "Simulyatsiya rejimi yoqildi, parking bo'sh");
      applyData(localSnapshot());
      localTimer = setInterval(function () { applyData(localSnapshot()); }, 1000);
      if (next === "demo") {
        demoTimer = setInterval(function () {
          const keys = Object.keys(local);
          const k = keys[Math.floor(Math.random() * keys.length)];
          const d = local[k];
          if (d.reserved) return;
          const parts = k.split("-");
          localToggleCar(Number(parts[0]), Number(parts[1]));
        }, 3500);
      }
    }
  }

  const modeBtns = document.querySelectorAll(".seg.modes button");
  for (const b of modeBtns) b.addEventListener("click", function () { setMode(b.dataset.mode); });

  const scenBtns = document.querySelectorAll(".scen button");
  for (const b of scenBtns) b.addEventListener("click", function () {
    if (mode === "real") { toast("Senariylar faqat simulyatsiya rejimida ishlaydi"); return; }
    const s = b.dataset.scen;
    if (s === "empty") { localReset("empty"); addLocalLog("Senariy: parking bo'shatildi"); }
    if (s === "full") { localReset("full"); addLocalLog("Senariy: parking to'ldirildi"); }
    if (s === "random") { localReset("random"); addLocalLog("Senariy: tasodifiy holat"); }
    if (s === "last") {
      localReset("full");
      local["2-3"] = { car: false, reserved: false, until: 0, extended: false };
      addLocalLog("Senariy: faqat bitta joy bo'sh qoldi (2-qavat, 3-joy)");
    }
    applyData(localSnapshot());
  });

  // =====================================================================
  //  SERVER (real rejim)
  // =====================================================================
  async function poll() {
    if (mode !== "real") return;
    try {
      const r = await fetch("/api/status", { cache: "no-store" });
      if (!r.ok) throw new Error("status");
      const data = await r.json();
      if (!data || !data.floors) throw new Error("format");
      everLive = true; failCount = 0;
      setStatusText("live");
      applyData(data);
      try {
        const re = await fetch("/api/events", { cache: "no-store" });
        if (re.ok) renderLog(await re.json());
      } catch (e2) { /* hodisalar tarixi ixtiyoriy */ }
    } catch (e) {
      failCount++;
      if (failCount >= 2) setStatusText("lost");
      if (!everLive && failCount === 3) {
        renderLog([{ time: new Date().toISOString(), text: "Server topilmadi. Simulyatsiya rejimiga o'ting." }]);
      }
    }
  }

  async function act(action, minutes) {
    const s = slots[openKey];
    if (!s) return;
    if (mode !== "real") { localAct(action, s.f, s.n, minutes); return; }
    try {
      const r = await fetch("/api/" + action, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ floor: s.f, slot: s.n, minutes: minutes }),
      });
      if (!r.ok) {
        const j = await r.json().catch(function () { return {}; });
        toast(j.error || "Amal bajarilmadi");
      } else {
        toast({ reserve: "Joy band qilindi, to'siq ko'tarilmoqda", extend: "Vaqt qo'shildi", arrive: "To'siq tushirildi, xush kelibsiz" }[action]);
      }
    } catch (e) {
      toast("Server bilan aloqa yo'q");
    }
    poll();
  }

  // =====================================================================
  //  JOY OYNASI
  // =====================================================================
  const sheet = document.getElementById("sheet");
  const chips = document.getElementById("chips");
  let openKey = null, chipsFor = null;

  function openSheet(key) {
    openKey = key; chipsFor = null;
    fillSheet();
    sheet.classList.add("open");
    document.body.classList.add("sheet-open");
  }
  function closeSheet() {
    openKey = null; chipsFor = null;
    sheet.classList.remove("open");
    document.body.classList.remove("sheet-open");
    chips.classList.remove("show");
  }

  function fillSheet() {
    const s = slots[openKey];
    if (!s) return;
    const st = s.status || "NO_DATA";
    document.getElementById("sheetTitle").textContent = s.f + "-qavat, " + s.n + "-joy";
    const stEl = document.getElementById("sheetState");
    stEl.textContent = LABEL[st];
    stEl.style.color = COLOR[st];
    const t = document.getElementById("sheetTimer");
    t.textContent = st === "RESERVED" ? fmt(s.remaining) : "";
    t.classList.toggle("low", st === "RESERVED" && s.remaining <= 60);

    const bR = document.getElementById("btnReserve");
    const bE = document.getElementById("btnExtend");
    const bA = document.getElementById("btnArrive");
    bR.disabled = st !== "FREE";
    bE.disabled = !(st === "RESERVED" && s.canExtend);
    bE.textContent = s.extended ? "Vaqt qo'shildi" : "Vaqt qo'shish";
    bA.disabled = st !== "RESERVED";
    bR.classList.toggle("primary", st === "FREE");
    bA.classList.toggle("primary", st === "RESERVED");

    const carBtn = document.getElementById("btnCar");
    carBtn.textContent = st === "OCCUPIED" ? "Mashinani olish" : "Mashina qo'yish";

    let note = "";
    if (st === "RESERVED" && !s.extended && !s.canExtend) note = "Vaqt qo'shish oxirgi 1 daqiqada ochiladi.";
    if (st === "RESERVED" && s.extended) note = "Vaqt faqat bir marta qo'shiladi.";
    if (s.value !== null && s.value !== undefined) note = note ? note + "  Sensor: " + s.value : "Sensor qiymati: " + s.value;
    document.getElementById("sheetNote").textContent = note;

    if ((chipsFor === "reserve" && st !== "FREE") || (chipsFor === "extend" && !s.canExtend)) showChips(null);
  }

  function showChips(type) {
    chipsFor = type;
    if (!type) { chips.classList.remove("show"); return; }
    const opts = type === "reserve" ? [10, 15, 20] : [1, 2, 3, 4, 5];
    document.getElementById("chipsTitle").textContent = type === "reserve" ? "Qancha vaqtga band qilasiz?" : "Qancha vaqt qo'shasiz?";
    document.getElementById("chipsRow").innerHTML = opts.map(function (m) { return '<button data-min="' + m + '">' + m + " daq</button>"; }).join("");
    chips.classList.add("show");
  }

  document.getElementById("btnReserve").addEventListener("click", function () { showChips(chipsFor === "reserve" ? null : "reserve"); });
  document.getElementById("btnExtend").addEventListener("click", function () { showChips(chipsFor === "extend" ? null : "extend"); });
  document.getElementById("btnArrive").addEventListener("click", function () { showChips(null); act("arrive"); });
  document.getElementById("btnCar").addEventListener("click", function () {
    if (mode === "real") { toast("Real rejimda mashinani sensor aniqlaydi"); return; }
    const s = slots[openKey];
    if (s) localToggleCar(s.f, s.n);
  });
  document.getElementById("chipsRow").addEventListener("click", function (e) {
    const b = e.target.closest("button[data-min]");
    if (!b || !chipsFor) return;
    const type = chipsFor;
    showChips(null);
    act(type, Number(b.dataset.min));
  });
  document.getElementById("sheetClose").addEventListener("click", closeSheet);

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("show"); }, 2600);
  }

  // =====================================================================
  //  QAVAT TANLASH VA KAMERA
  // =====================================================================
  let targetY = 12, focusFloor = 0;
  const floorBtns = document.querySelectorAll(".seg.floors button");
  for (const b of floorBtns) b.addEventListener("click", function () {
    focusFloor = Number(b.dataset.floor);
    for (const x of floorBtns) x.setAttribute("aria-pressed", String(x === b));
    for (const k of [1, 2, 3]) floorGroup[k].visible = focusFloor === 0 || k <= focusFloor;
    targetY = focusFloor === 0 ? 12 : FY[focusFloor] + 2;
    closeSheet();
  });

  function fitCamera() {
    const aspect = camera.aspect;
    const dist = Math.min(260, Math.max(118, 88 / (0.728 * aspect)));
    const dir = aspect < 1 ? new THREE.Vector3(0.52, 0.78, 0.62) : new THREE.Vector3(0.58, 0.52, 0.78);
    dir.normalize().multiplyScalar(dist);
    camera.position.copy(controls.target).add(dir);
  }

  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize);
  resize();
  fitCamera();

  // =====================================================================
  //  BOSISH: chap tugma = joy oynasi, o'ng tugma yoki uzoq bosish = mashina
  // =====================================================================
  const raycaster = new THREE.Raycaster(), pointer = new THREE.Vector2();
  let down = null, longTimer = null, longFired = false;

  function shown(o) { for (let p = o; p; p = p.parent) if (!p.visible) return false; return true; }

  function pickAt(clientX, clientY) {
    const r = canvas.getBoundingClientRect();
    pointer.x = ((clientX - r.left) / r.width) * 2 - 1;
    pointer.y = -((clientY - r.top) / r.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const hit = raycaster.intersectObjects(pickables.filter(shown), false)[0];
    return hit ? hit.object.userData.key : null;
  }

  function toggleCarAt(key) {
    if (!key) return;
    if (mode === "real") { toast("Real rejimda mashinani sensor aniqlaydi"); return; }
    const s = slots[key];
    localToggleCar(s.f, s.n);
  }

  canvas.addEventListener("pointerdown", function (e) {
    down = { x: e.clientX, y: e.clientY };
    longFired = false;
    clearTimeout(longTimer);
    longTimer = setTimeout(function () {
      longFired = true;
      toggleCarAt(pickAt(e.clientX, e.clientY));
    }, 550);
  });
  canvas.addEventListener("pointermove", function (e) {
    if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 8) clearTimeout(longTimer);
  });
  canvas.addEventListener("pointercancel", function () { clearTimeout(longTimer); });
  canvas.addEventListener("pointerup", function (e) {
    clearTimeout(longTimer);
    if (longFired) { longFired = false; down = null; return; }
    if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 8) { down = null; return; }
    down = null;
    const key = pickAt(e.clientX, e.clientY);
    if (key) openSheet(key); else closeSheet();
  });
  canvas.addEventListener("contextmenu", function (e) {
    e.preventDefault();
    clearTimeout(longTimer);
    toggleCarAt(pickAt(e.clientX, e.clientY));
  });

  // =====================================================================
  //  ANIMATSIYA
  // =====================================================================
  function animate() {
    requestAnimationFrame(animate);
    for (const k of Object.keys(slots)) {
      const s = slots[k];
      const target = s.status === "RESERVED" ? 0 : -Math.PI / 2;
      s.pivot.rotation.x += (target - s.pivot.rotation.x) * 0.1;
      if (s.dropY > 0.01) s.dropY *= 0.84; else s.dropY = 0;
      s.car.position.y = s.dropY;
    }
    controls.target.y += (targetY - controls.target.y) * 0.08;
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  // =====================================================================
  //  KUNDUZ / TUN
  // =====================================================================
  function setNight(on) {
    NIGHT.on = on;
    const btn = document.getElementById("nightBtn");
    btn.textContent = on ? "☀️ Kunduz" : "🌙 Tun";
    btn.setAttribute("aria-pressed", String(on));

    if (NIGHT.skyMat) {
      NIGHT.skyMat.vertexColors = !on;
      NIGHT.skyMat.color.set(on ? 0x0b1220 : 0xffffff);
      NIGHT.skyMat.needsUpdate = true;
    }
    if (scene.fog) {
      scene.fog.color.set(on ? 0x0e1726 : 0xcfdae2);
      scene.fog.near = on ? 220 : 300;
      scene.fog.far = on ? 620 : 760;
    }
    scene.background = new THREE.Color(on ? 0x0b1220 : sceneColor);

    sun.intensity = on ? 0.16 : 1.1;
    sun.color.set(on ? 0x9ab4d8 : 0xffffff);
    hemi.intensity = on ? 0.14 : 0.45;
    hemi.color.set(on ? 0x7e93b5 : 0xffffff);
    renderer.toneMappingExposure = on ? 0.95 : 1.05;

    for (const l of NIGHT.lamps) l.intensity = on ? 1.5 : 0;
    for (const l of NIGHT.indoor) l.intensity = on ? 1.1 : 0;
    if (NIGHT.lampMat) NIGHT.lampMat.emissiveIntensity = on ? 2.4 : 0.4;
    if (NIGHT.ceilMat) NIGHT.ceilMat.emissiveIntensity = on ? 1.6 : 0.15;
    if (NIGHT.head) NIGHT.head.emissiveIntensity = on ? 2.2 : 0.9;
    if (NIGHT.tail) NIGHT.tail.emissiveIntensity = on ? 1.6 : 0.6;
    for (const k of Object.keys(slots)) slots[k].tintMat.opacity = on ? 0.5 : (slots[k].status === "NO_DATA" ? 0.5 : 0.34);
  }
  document.getElementById("nightBtn").addEventListener("click", function () { setNight(!NIGHT.on); });
  setNight(false);

  // Boshlash: real rejim
  setMode("real");
})();
</script>
</body>
</html>
